# Self-contained Hyprland config (hyprlang). Ported from Omarchy defaults + personal overrides.
# Theme: Catppuccin Mocha. Helper scripts live in ~/dotfiles/bin (installed to ~/.local/bin as dot-*).

################ ENV ################
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = GDK_SCALE,2
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_STYLE_OVERRIDE,kvantum
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = OZONE_PLATFORM,wayland
env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland

xwayland {
  force_zero_scaling = true
}

ecosystem {
  no_update_news = true
}

################ MONITORS ################
# hyprctl monitors  -> list outputs. Retina-class 2x display.
monitor = , preferred, auto, 2
# External 1440p example (see scripts/toggle-monitors.sh):
# monitor = HDMI-A-1, 2560x1440@60, auto, 1

################ LOOK & FEEL ################
$activeBorderColor = rgb(89b4fa)
$inactiveBorderColor = rgba(595959aa)

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = $activeBorderColor
    col.inactive_border = $inactiveBorderColor
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 0

    shadow {
        enabled = true
        range = 2
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 2
        passes = 2
        special = true
        brightness = 0.60
        contrast = 0.75
    }
}

group {
    col.border_active = $activeBorderColor
    col.border_inactive = $inactiveBorderColor
    col.border_locked_active = $activeBorderColor
    col.border_locked_inactive = $inactiveBorderColor

    groupbar {
        font_size = 12
        font_family = monospace
        font_weight_active = ultraheavy
        font_weight_inactive = normal
        indicator_height = 0
        indicator_gap = 5
        height = 22
        gaps_in = 5
        gaps_out = 0
        text_color = rgb(ffffff)
        text_color_inactive = rgba(ffffff90)
        col.active = rgba(00000040)
        col.inactive = rgba(00000020)
        gradients = true
        gradient_rounding = 0
        gradient_round_only_edges = false
    }
}

animations {
    enabled = yes, please :)

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 3.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 0, 0, ease
    animation = specialWorkspace, 1, 3, easeOutQuint, slidevert
}

dwindle {
    preserve_split = true
    force_split = 2
}

scrolling {
    column_width = 0.49
}

master {
    new_status = master
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    disable_scale_notification = true
    focus_on_activate = true
    anr_missed_pings = 3
    on_focus_under_fullscreen = 1
    key_press_enables_dpms = true
    mouse_move_enables_dpms = true
}

cursor {
    hide_on_key_press = true
    warp_on_change_workspace = 1
}

binds {
    hide_special_on_workspace_change = true
}

################ INPUT ################
input {
    kb_layout = us
    kb_options = compose:caps
    repeat_rate = 40
    repeat_delay = 250
    numlock_by_default = true
    follow_mouse = 1
    sensitivity = 0
    force_no_accel = true

    touchpad {
        natural_scroll = false
        scroll_factor = 0.4
    }
}

################ WINDOW RULES ################
windowrule = suppress_event maximize, match:class .*
windowrule = tag +default-opacity, match:class .*
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0

# Browsers
windowrule = tag +chromium-based-browser, match:class ((google-)?[cC]hrom(e|ium)|[bB]rave-browser|[mM]icrosoft-edge|Vivaldi-stable|helium)
windowrule = tag +firefox-based-browser, match:class ([fF]irefox|zen|librewolf)
windowrule = tag -default-opacity, match:tag chromium-based-browser
windowrule = tag -default-opacity, match:tag firefox-based-browser
windowrule = tag -chromium-based-browser, match:class (chrome-youtube.com__-Default|chrome-app.zoom.us__wc_home-Default)
windowrule = tag -default-opacity, match:class (chrome-youtube.com__-Default|chrome-app.zoom.us__wc_home-Default)
windowrule = tile on, match:tag chromium-based-browser
windowrule = opacity 1.0 0.985, match:tag chromium-based-browser
windowrule = opacity 1.0 0.985, match:tag firefox-based-browser
windowrule = workspace special silent, match:title .*is sharing.*

# Terminals
windowrule = tag +terminal, match:class (Alacritty|kitty|com.mitchellh.ghostty|foot)
windowrule = tag -default-opacity, match:tag terminal
windowrule = opacity 0.985 0.96, match:tag terminal
windowrule = scroll_touchpad 1.5, match:class (Alacritty|kitty|foot)
windowrule = scroll_touchpad 0.2, match:class com.mitchellh.ghostty

# Picture-in-picture
windowrule = tag +pip, match:title (Picture.?in.?[Pp]icture)
windowrule = tag -default-opacity, match:tag pip
windowrule = float on, match:tag pip
windowrule = pin on, match:tag pip
windowrule = size 600 338, match:tag pip
windowrule = keep_aspect_ratio on, match:tag pip
windowrule = border_size 0, match:tag pip
windowrule = opacity 1 1, match:tag pip
windowrule = move (monitor_w-window_w-40) (monitor_h*0.04), match:tag pip

# Steam
windowrule = float on, match:class steam
windowrule = center on, match:class steam, match:title Steam
windowrule = tag -default-opacity, match:class steam.*
windowrule = opacity 1 1, match:class steam.*
windowrule = size 1100 700, match:class steam, match:title Steam
windowrule = size 460 800, match:class steam, match:title Friends List
windowrule = idle_inhibit fullscreen, match:class steam

# Floating helpers (TUI launched via dot-launch-tui get class org.local.<cmd>)
windowrule = float on, match:tag floating-window
windowrule = center on, match:tag floating-window
windowrule = size 875 600, match:tag floating-window
windowrule = tag +floating-window, match:class (org.local.bluetui|org.local.impala|org.local.wiremix|org.local.btop|org.gnome.NautilusPreviewer|org.gnome.Evince|com.gabm.satty|imv|mpv)
windowrule = tag +floating-window, match:class (xdg-desktop-portal-gtk|org.gnome.Nautilus), match:title ^(Open.*Files?|Open [F|f]older.*|Save.*Files?|Save.*As|Save|All Files|.*wants to [open|save].*|[C|c]hoose.*)
windowrule = float on, match:class org.gnome.Calculator

# No transparency on media windows
windowrule = tag -default-opacity, match:class ^(zoom|vlc|mpv|org.kde.kdenlive|com.obsproject.Studio|com.github.PintaProject.Pinta|imv|org.gnome.NautilusPreviewer)$
windowrule = opacity 1 1, match:class ^(zoom|vlc|mpv|org.kde.kdenlive|com.obsproject.Studio|com.github.PintaProject.Pinta|imv|org.gnome.NautilusPreviewer)$
windowrule = tag -default-opacity, match:class qemu
windowrule = opacity 1 1, match:class qemu

windowrule = rounding 8, match:tag pop
windowrule = idle_inhibit always, match:tag noidle

layerrule = no_anim on, match:namespace walker

# LocalSend, 1Password, Typora, Telegram
windowrule = float on, match:class (Share|localsend)
windowrule = center on, match:class (Share|localsend)
windowrule = size 1100 700, match:class localsend
windowrule = no_screen_share on, match:class ^(1[p|P]assword)$
windowrule = tag +floating-window, match:class ^(1[p|P]assword)$
windowrule = match:class ^Typora$, match:title ^Print$, float on, center on
windowrule = focus_on_activate off, match:class org.telegram.desktop

# Default opacity last, after apps had a chance to opt out
windowrule = opacity 0.985 0.96, match:tag default-opacity

################ AUTOSTART ################
exec-once = uwsm app -- hypridle
exec-once = uwsm app -- mako
exec-once = uwsm app -- waybar
exec-once = uwsm app -- fcitx5 --disable notificationitem
exec-once = uwsm app -- swaybg -i ~/.config/hypr/wallpaper.png -m fill
exec-once = uwsm app -- swayosd-server
exec-once = systemctl --user start hyprpolkitagent
exec-once = systemctl --user import-environment $(env | cut -d'=' -f 1)
exec-once = dbus-update-activation-environment --systemd --all

################ BINDINGS ################
# --- Clipboard
bindd = SUPER, C, Universal copy, sendshortcut, CTRL, Insert, activewindow
bindd = SUPER, V, Universal paste, sendshortcut, SHIFT, Insert, activewindow
bindd = SUPER, X, Universal cut, sendshortcut, CTRL, X, activewindow
bindd = SUPER CTRL, V, Clipboard manager, exec, dot-walker -m clipboard

# --- Media / brightness (swayosd)
bindeld = ,XF86AudioRaiseVolume, Volume up, exec, swayosd-client --output-volume raise
bindeld = ,XF86AudioLowerVolume, Volume down, exec, swayosd-client --output-volume lower
bindeld = ,XF86AudioMute, Mute, exec, swayosd-client --output-volume mute-toggle
bindeld = ,XF86AudioMicMute, Mute microphone, exec, swayosd-client --input-volume mute-toggle
bindeld = ,XF86MonBrightnessUp, Brightness up, exec, swayosd-client --brightness raise
bindeld = ,XF86MonBrightnessDown, Brightness down, exec, swayosd-client --brightness lower
bindeld = SHIFT, XF86MonBrightnessUp, Brightness maximum, exec, brightnessctl set 100%
bindeld = SHIFT, XF86MonBrightnessDown, Brightness minimum, exec, brightnessctl set 1%
bindeld = ,XF86KbdBrightnessUp, Keyboard brightness up, exec, brightnessctl -d '*kbd_backlight' set +1
bindeld = ,XF86KbdBrightnessDown, Keyboard brightness down, exec, brightnessctl -d '*kbd_backlight' set 1-
bindeld = ALT, XF86AudioRaiseVolume, Volume up precise, exec, swayosd-client --output-volume +1
bindeld = ALT, XF86AudioLowerVolume, Volume down precise, exec, swayosd-client --output-volume -1
bindeld = ALT, XF86MonBrightnessUp, Brightness up precise, exec, brightnessctl set +1%
bindeld = ALT, XF86MonBrightnessDown, Brightness down precise, exec, brightnessctl set 1%-
bindld = , XF86AudioNext, Next track, exec, swayosd-client --playerctl next
bindld = , XF86AudioPause, Pause, exec, swayosd-client --playerctl play-pause
bindld = , XF86AudioPlay, Play, exec, swayosd-client --playerctl play-pause
bindld = , XF86AudioPrev, Previous track, exec, swayosd-client --playerctl previous
bindld = SUPER, XF86AudioMute, Switch audio output, exec, dot-audio-output-switch
bindd = , XF86Calculator, Calculator, exec, gnome-calculator

# --- Tiling
# Close windows
bindd = SUPER, W, Close window, killactive,
bindd = CTRL ALT, DELETE, Close all windows, exec, dot-window-close-all

# Control tiling

# Move focus with SUPER + arrow keys
bindd = SUPER, LEFT, Focus on left window, movefocus, l
bindd = SUPER, RIGHT, Focus on right window, movefocus, r
bindd = SUPER, UP, Focus on above window, movefocus, u
bindd = SUPER, DOWN, Focus on below window, movefocus, d

# Switch workspaces with SUPER + [1-9; 0]
bindd = SUPER, code:10, Switch to workspace 1, workspace, 1
bindd = SUPER, code:11, Switch to workspace 2, workspace, 2
bindd = SUPER, code:12, Switch to workspace 3, workspace, 3
bindd = SUPER, code:13, Switch to workspace 4, workspace, 4
bindd = SUPER, code:14, Switch to workspace 5, workspace, 5
bindd = SUPER, code:15, Switch to workspace 6, workspace, 6
bindd = SUPER, code:16, Switch to workspace 7, workspace, 7
bindd = SUPER, code:17, Switch to workspace 8, workspace, 8
bindd = SUPER, code:18, Switch to workspace 9, workspace, 9
bindd = SUPER, code:19, Switch to workspace 10, workspace, 10

# Move active window to a workspace with SUPER + SHIFT + [1-9; 0]
bindd = SUPER SHIFT, code:10, Move window to workspace 1, movetoworkspace, 1
bindd = SUPER SHIFT, code:11, Move window to workspace 2, movetoworkspace, 2
bindd = SUPER SHIFT, code:12, Move window to workspace 3, movetoworkspace, 3
bindd = SUPER SHIFT, code:13, Move window to workspace 4, movetoworkspace, 4
bindd = SUPER SHIFT, code:14, Move window to workspace 5, movetoworkspace, 5
bindd = SUPER SHIFT, code:15, Move window to workspace 6, movetoworkspace, 6
bindd = SUPER SHIFT, code:16, Move window to workspace 7, movetoworkspace, 7
bindd = SUPER SHIFT, code:17, Move window to workspace 8, movetoworkspace, 8
bindd = SUPER SHIFT, code:18, Move window to workspace 9, movetoworkspace, 9
bindd = SUPER SHIFT, code:19, Move window to workspace 10, movetoworkspace, 10

# Move active window silently to a workspace with SUPER + SHIFT + ALT + [1-9; 0]
bindd = SUPER SHIFT ALT, code:10, Move window silently to workspace 1, movetoworkspacesilent, 1
bindd = SUPER SHIFT ALT, code:11, Move window silently to workspace 2, movetoworkspacesilent, 2
bindd = SUPER SHIFT ALT, code:12, Move window silently to workspace 3, movetoworkspacesilent, 3
bindd = SUPER SHIFT ALT, code:13, Move window silently to workspace 4, movetoworkspacesilent, 4
bindd = SUPER SHIFT ALT, code:14, Move window silently to workspace 5, movetoworkspacesilent, 5
bindd = SUPER SHIFT ALT, code:15, Move window silently to workspace 6, movetoworkspacesilent, 6
bindd = SUPER SHIFT ALT, code:16, Move window silently to workspace 7, movetoworkspacesilent, 7
bindd = SUPER SHIFT ALT, code:17, Move window silently to workspace 8, movetoworkspacesilent, 8
bindd = SUPER SHIFT ALT, code:18, Move window silently to workspace 9, movetoworkspacesilent, 9
bindd = SUPER SHIFT ALT, code:19, Move window silently to workspace 10, movetoworkspacesilent, 10

# Control scratchpad
bindd = SUPER, S, Toggle scratchpad, togglespecialworkspace, scratchpad
bindd = SUPER ALT, S, Move window to scratchpad, movetoworkspacesilent, special:scratchpad

# TAB between workspaces
bindd = SUPER, TAB, Next workspace, workspace, e+1
bindd = SUPER SHIFT, TAB, Previous workspace, workspace, e-1
bindd = SUPER CTRL, TAB, Former workspace, workspace, previous

# Move workspaces to other monitors
bindd = SUPER SHIFT ALT, LEFT, Move workspace to left monitor, movecurrentworkspacetomonitor, l
bindd = SUPER SHIFT ALT, RIGHT, Move workspace to right monitor, movecurrentworkspacetomonitor, r
bindd = SUPER SHIFT ALT, UP, Move workspace to up monitor, movecurrentworkspacetomonitor, u
bindd = SUPER SHIFT ALT, DOWN, Move workspace to down monitor, movecurrentworkspacetomonitor, d

# Swap active window with the one next to it with SUPER + SHIFT + arrow keys
bindd = SUPER SHIFT, LEFT, Swap window to the left, swapwindow, l
bindd = SUPER SHIFT, RIGHT, Swap window to the right, swapwindow, r
bindd = SUPER SHIFT, UP, Swap window up, swapwindow, u
bindd = SUPER SHIFT, DOWN, Swap window down, swapwindow, d

# Cycle through applications on active workspace
bindd = ALT, TAB, Focus on next window, cyclenext
bindd = ALT SHIFT, TAB, Focus on previous window, cyclenext, prev
bindd = ALT, TAB, Reveal active window on top, bringactivetotop
bindd = ALT SHIFT, TAB, Reveal active window on top, bringactivetotop

# Cycle through monitors
bindd = CTRL ALT, TAB, Focus on next monitor, focusmonitor, +1
bindd = CTRL ALT SHIFT, TAB, Focus on previous monitor, focusmonitor, -1

# Resize active window
bindd = SUPER, code:20, Expand window left, resizeactive, -100 0    # - key
bindd = SUPER, code:21, Shrink window left, resizeactive, 100 0     # = key
bindd = SUPER SHIFT, code:20, Shrink window up, resizeactive, 0 -100
bindd = SUPER SHIFT, code:21, Expand window down, resizeactive, 0 100

# Scroll through existing workspaces with SUPER + scroll
bindd = SUPER, mouse_down, Scroll active workspace forward, workspace, e+1
bindd = SUPER, mouse_up, Scroll active workspace backward, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindmd = SUPER, mouse:272, Move window, movewindow
bindmd = SUPER, mouse:273, Resize window, resizewindow

# Toggle groups
bindd = SUPER, G, Toggle window grouping, togglegroup
bindd = SUPER ALT, G, Move active window out of group, moveoutofgroup

# Join groups
bindd = SUPER ALT, LEFT, Move window to group on left, moveintogroup, l
bindd = SUPER ALT, RIGHT, Move window to group on right, moveintogroup, r
bindd = SUPER ALT, UP, Move window to group on top, moveintogroup, u
bindd = SUPER ALT, DOWN, Move window to group on bottom, moveintogroup, d

# Navigate a single set of grouped windows
bindd = SUPER ALT, TAB, Next window in group, changegroupactive, f
bindd = SUPER ALT SHIFT, TAB, Previous window in group, changegroupactive, b

# Window navigation for grouped windows
bindd = SUPER CTRL, LEFT, Move grouped window focus left, changegroupactive, b
bindd = SUPER CTRL, RIGHT, Move grouped window focus right, changegroupactive, f

# Scroll through a set of grouped windows with SUPER + ALT + scroll
bindd = SUPER ALT, mouse_down, Next window in group, changegroupactive, f
bindd = SUPER ALT, mouse_up, Previous window in group, changegroupactive, b

# Activate window in a group by number
bindd = SUPER ALT, code:10, Switch to group window 1, changegroupactive, 1
bindd = SUPER ALT, code:11, Switch to group window 2, changegroupactive, 2
bindd = SUPER ALT, code:12, Switch to group window 3, changegroupactive, 3
bindd = SUPER ALT, code:13, Switch to group window 4, changegroupactive, 4
bindd = SUPER ALT, code:14, Switch to group window 5, changegroupactive, 5


# Window state (tiling-v2 extras)
bindd = SUPER, J, Toggle window split, layoutmsg, togglesplit
bindd = SUPER, P, Pseudo window, pseudo,
bindd = SUPER, T, Toggle window floating/tiling, togglefloating,
bindd = SUPER, F, Full screen, fullscreen, 0
bindd = SUPER CTRL, F, Tiled full screen, fullscreenstate, 0 2
bindd = SUPER ALT, F, Full width, fullscreen, 1
bindd = SUPER, O, Pop window out (float & pin), exec, dot-window-pop

# --- Launchers / utilities
bindd = SUPER, SPACE, Launch apps, exec, dot-walker
bindd = SUPER CTRL, E, Emoji picker, exec, dot-walker -m symbols
bindd = SUPER, ESCAPE, Lock system, exec, dot-lock
bindld = , XF86PowerOff, Lock, exec, dot-lock
bindd = SUPER CTRL, L, Lock system, exec, dot-lock
bindd = SUPER SHIFT, SPACE, Toggle top bar, exec, pkill -SIGUSR1 waybar

# Notifications
bindd = SUPER, COMMA, Dismiss last notification, exec, makoctl dismiss
bindd = SUPER SHIFT, COMMA, Dismiss all notifications, exec, makoctl dismiss --all
bindd = SUPER CTRL, COMMA, Toggle silencing notifications, exec, dot-toggle-notification-silencing
bindd = SUPER ALT, COMMA, Invoke last notification, exec, makoctl invoke
bindd = SUPER SHIFT ALT, COMMA, Restore last notification, exec, makoctl restore

# Toggles
bindd = SUPER CTRL, I, Toggle locking on idle, exec, dot-toggle-idle
bindd = SUPER CTRL, N, Toggle nightlight, exec, dot-toggle-nightlight
bindd = SUPER CTRL, Delete, Toggle laptop display, exec, dot-monitor-internal toggle
bindl = , switch:on:Lid Switch, exec, dot-external-monitors && dot-monitor-internal off
bindl = , switch:off:Lid Switch, exec, dot-monitor-internal on

# Captures
bindd = , PRINT, Screenshot, exec, dot-screenshot
bindd = SUPER, PRINT, Color picker, exec, pkill hyprpicker || hyprpicker -a

# Control panels
bindd = SUPER CTRL, A, Audio controls, exec, dot-launch-tui wiremix
bindd = SUPER CTRL, B, Bluetooth controls, exec, dot-launch-tui bluetui
bindd = SUPER CTRL, W, Wifi controls, exec, dot-launch-tui impala
bindd = SUPER CTRL, T, Activity, exec, dot-launch-or-focus btop "dot-launch-tui btop"

# Zoom
bindd = SUPER CTRL, Z, Zoom in, exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float + 1')
bindd = SUPER CTRL ALT, Z, Reset zoom, exec, hyprctl keyword cursor:zoom_factor 1

# --- Applications (personal)
bindd = SUPER, RETURN, Terminal, exec, uwsm app -- ghostty --working-directory="$(dot-terminal-cwd)"
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm app -- ghostty --working-directory="$(dot-terminal-cwd)" -e bash -c "tmux attach || tmux new -s Work"
bindd = SUPER SHIFT, RETURN, Browser, exec, dot-launch-browser
bindd = SUPER SHIFT, F, File manager, exec, uwsm app -- nautilus --new-window
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm app -- nautilus --new-window "$(dot-terminal-cwd)"
bindd = SUPER SHIFT, B, Browser, exec, dot-launch-browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, dot-launch-browser --private
bindd = SUPER SHIFT, M, Music, exec, dot-launch-or-focus spotify
bindd = SUPER SHIFT, N, Editor, exec, dot-launch-editor
bindd = SUPER SHIFT, D, Docker, exec, dot-launch-tui lazydocker
bindd = SUPER SHIFT, G, Signal, exec, dot-launch-or-focus ^signal$ "uwsm app -- signal-desktop"
bindd = SUPER SHIFT, O, Obsidian, exec, dot-launch-or-focus ^obsidian$ "uwsm app -- obsidian"
bindd = SUPER SHIFT, W, Typora, exec, uwsm app -- typora --enable-wayland-ime
bindd = SUPER SHIFT, SLASH, Passwords, exec, uwsm app -- keepassxc
bindd = SUPER SHIFT, A, ChatGPT, exec, dot-launch-webapp "https://chatgpt.com"
bindd = SUPER SHIFT ALT, A, Grok, exec, dot-launch-webapp "https://grok.com"
bindd = SUPER SHIFT, C, Calendar, exec, dot-launch-webapp "https://app.hey.com/calendar/weeks/"
bindd = SUPER SHIFT, E, Email, exec, dot-launch-webapp "https://app.hey.com"
bindd = SUPER SHIFT, Y, YouTube, exec, dot-launch-webapp "https://youtube.com/"
bindd = SUPER SHIFT ALT, G, WhatsApp, exec, dot-launch-or-focus WhatsApp "dot-launch-webapp https://web.whatsapp.com/"
bindd = SUPER SHIFT CTRL, G, Google Messages, exec, dot-launch-or-focus "Google Messages" "dot-launch-webapp https://messages.google.com/web/conversations"
bindd = SUPER SHIFT, P, Google Photos, exec, dot-launch-or-focus "Google Photos" "dot-launch-webapp https://photos.google.com/"
bindd = SUPER SHIFT, X, X, exec, dot-launch-webapp "https://x.com/"
bindd = SUPER SHIFT ALT, X, X Post, exec, dot-launch-webapp "https://x.com/compose/post"

# Toggle monitor profile (external-only <-> laptop-only)
bindd = SUPER CTRL, M, Toggle monitors, exec, bash -lc '~/.config/hypr/scripts/toggle-monitors.sh'

# Screen off
bindd = SUPER ALT, SPACE, Screen off, exec, sleep 2 && hyprctl dispatch dpms off
