# Catppuccin Mocha. Layout inspired by 43PR/dotfiles:
# https://github.com/43PR/dotfiles/blob/main/.config/hypr/hyprlock.conf
# Native widgets only; no blur, screenshots, shadows, or animations.
# The clock is built in; date is the only shell command (once per minute).
$base = rgb(1e1e2e)
$surface = rgb(181825)
$text = rgb(cdd6f4)
$muted = rgb(a6adc8)
$blue = rgb(89b4fa)
$mauve = rgb(cba6f7)
$green = rgb(a6e3a1)
$red = rgb(f38ba8)
$font = SUSE Mono

general {
    ignore_empty_input = true
    hide_cursor = true
}

background {
    monitor =
    color = $base
    blur_passes = 0
}

animations {
    enabled = false
}

input-field {
    monitor =
    size = 320, 54
    position = 0, 0
    halign = center
    valign = center

    inner_color = $surface
    outer_color = $blue $mauve 45deg
    outline_thickness = 2

    font_family = $font
    font_color = $text

    placeholder_text = <span foreground="##a6adc8">Password</span>
    check_color = $green
    fail_color = $red
    capslock_color = rgb(f9e2af)
    check_text = Checking…
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    dots_size = 0.2
    dots_spacing = 0.3

    rounding = 27
    shadow_passes = 0
    fade_on_empty = false
}

# Clock and date sit above the centered unlock field on every output.
label {
    monitor =
    text = $TIME
    color = $text
    font_size = 76
    font_family = $font
    position = 0, -12%
    halign = center
    valign = top
    shadow_passes = 0
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = $muted
    font_size = 16
    font_family = $font
    position = 0, -30%
    halign = center
    valign = top
    shadow_passes = 0
}

label {
    monitor =
    text = $USER
    color = $mauve
    font_size = 18
    font_family = $font
    position = 0, 70
    halign = center
    valign = center
    shadow_passes = 0
}

label {
    monitor =
    text = $LAYOUT
    color = $muted
    font_size = 12
    font_family = $font
    position = 0, -70
    halign = center
    valign = center
    shadow_passes = 0
}

# Use the already installed Nerd Font for the NixOS snowflake. Propo, not the plain
# variant: plain gives icons a one-cell advance, so hyprlock clips them in half.
label {
    monitor =
    text = 
    color = $blue
    font_size = 30
    font_family = JetBrainsMono Nerd Font Propo
    position = 0, 95
    halign = center
    valign = bottom
    shadow_passes = 0
}

label {
    monitor =
    text = nix btw
    color = $muted
    font_size = 11
    font_family = $font
    position = 0, 64
    halign = center
    valign = bottom
    shadow_passes = 0
}

auth {
    fingerprint:enabled = false
}
